<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <style>
      .danger-zone { fill: rgba(255, 59, 48, 0.25); stroke: rgba(255, 59, 48, 0.8); stroke-dasharray: 8 6; }
      .warning-zone { fill: rgba(255, 149, 0, 0.2); stroke: rgba(255, 149, 0, 0.8); stroke-dasharray: 8 6; }
      .safe-zone { fill: rgba(52, 199, 89, 0.05); stroke: #34c759; stroke-width: 4; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 28px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .sub-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; fill: rgba(255, 255, 255, 0.8); text-anchor: middle; }
    </style>
  </defs>

  <!-- Background Base (Transparent) -->
  <rect width="1080" height="1920" fill="transparent"/>

  <!-- Top Header Zone (Search / Live / Tabs) -->
  <rect x="0" y="0" width="1080" height="160" class="warning-zone"/>
  <text x="540" y="90" class="label">⚠️ VÙNG NÚT ĐẦU TRANG (Search / Tabs)</text>
  <text x="540" y="125" class="sub-label">Tránh đặt chữ hoặc thông số quan trọng</text>

  <!-- Right Sidebar Zone (Avatar, Like, Comment, Share, Music Disk) -->
  <rect x="910" y="550" width="170" height="1000" class="danger-zone"/>
  <text x="995" y="1050" class="label" transform="rotate(-90 995 1050)">⛔ KHU VỰC TƯƠNG TÁC (Like / Share)</text>

  <!-- Bottom Caption Zone (Account Name, Title, Sound Info) -->
  <rect x="0" y="1550" width="910" height="370" class="danger-zone"/>
  <text x="455" y="1720" class="label">⛔ KHU VỰC TIÊU ĐỀ &amp; CAPTION TIKTOK</text>
  <text x="455" y="1760" class="sub-label">Tuyệt đối không để phụ đề (Subtitles) lọt xuống đây</text>

  <!-- Safe Zone Box -->
  <rect x="70" y="180" width="820" height="1350" class="safe-zone"/>
  <text x="480" y="240" class="label" fill="#34c759">✅ VÙNG AN TOÀN TUYỆT ĐỐI (SAFE ZONE 9:16)</text>
  <text x="480" y="280" class="sub-label" fill="#34c759">Đặt Subtitle, Meme, Thông số súng &amp; Trang bị ở đây</text>
</svg>

